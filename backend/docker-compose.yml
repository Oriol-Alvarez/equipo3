# Backend para Sonrisas:
#   docker compose up -d                   base de datos, almacén S3 y API FastAPI (http://localhost:8000)
#   docker compose exec api uv run --no-sync pytest   ejecutar pruebas unitarias en el contenedor
#   docker compose --profile tunel up -d   habilitar túnel HTTPS Cloudflare
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sonrisas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sonrisas"]
      interval: 2s
      retries: 30

  # Almacén de objetos compatible con S3 (RustFS) para fotografías, certificados y adjuntos
  almacen:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-sonrisas-admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-sonrisas-secret-key-12345678}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - objetos:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/sonrisas
      S3_ENDPOINT: http://almacen:9000
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
      # Credenciales privadas (p. ej. Firebase). La carpeta está en .gitignore.
      - ./secretos:/code/secretos:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      almacen:
        condition: service_healthy

  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - api
    profiles: ["tunel"]

volumes:
  pgdata:
  objetos:
