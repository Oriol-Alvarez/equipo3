[project]
name = "sonrisas-backend"
version = "0.1.0"
description = "Backend REST y WebSocket para Sonrisas App: FastAPI + PostgreSQL + RustFS/S3, arquitectura de la Practica 11"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "boto3>=1.35.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning",
]
